# Linux: how the DRC loopback is created and, crucially, what clocks it.
#
# Install to: /etc/modprobe.d/omdrc-snd-aloop.conf
# (read by modprobe when snd-aloop is loaded — see
#  etc/modules-load.d/snd-aloop.conf, which is what loads it at boot.)
#
# ── index / id ──────────────────────────────────────────────────────────────
# The rest of the chain addresses the loopback by name: mpd.conf writes to
# hw:Loopback,0,0 and brutefir_defaults.linux.conf reads hw:1,1.  Pinning the
# index keeps the numeric form true no matter what order the USB cards attach
# in, which is the same problem /dev/dsp.dac solves on FreeBSD.
#
# ── timer_source: the part that is easy to leave out and expensive to miss ──
# snd-aloop has no clock of its own.  By default it is driven by a system
# hrtimer, which means the Linux chain
#
#     CD ──► ESI ──► alsaloop ──► aloop ──► BruteFIR ──► DAC
#
# has TWO free-running clock pairs (CD <-> aloop-timer, and aloop-timer <->
# DAC), where the FreeBSD chain has one: virtual_oss is clocked by the DAC it
# feeds.  The second pair is normally invisible because both BruteFIR stanzas
# set ignore_xrun, so it shows up as an occasional discontinuity rather than an
# error — the worst way for a fault to present itself.
#
# timer_source clocks the loopback from a real card's timer.  Pointed at the DAC,
# the loopback advances at the DAC's rate, the topology becomes the same shape
# as the FreeBSD one, and the CD <-> DAC drift is the only drift left — which
# is exactly the drift alsaloop --sync=playshift is there to correct.
#
# The card below is maintained by omdrc-config-helper: applying a DAC on the
# /configuration page rewrites the marked line to the selected card.  Editing
# it by hand is fine; the marker is what must survive.
#
# NOTE: the module is loaded at boot, so a change here takes effect on the next
# reboot (or after `rmmod snd_aloop` with the whole chain stopped, which the
# helper does not attempt — a loopback pulled out from under BruteFIR and MPD
# is not worth automating).
options snd-aloop index=1 id=Loopback pcm_substreams=2 timer_source="hw:0,0,0"  # omdrc-managed-aloop-timer
