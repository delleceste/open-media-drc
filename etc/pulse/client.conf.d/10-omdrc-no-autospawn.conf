# open-media-drc: never let a PulseAudio server appear on this box.
#
# The DAC is single-open: hw.snd.vchans_enable=0 and dev.pcm.<unit>.bitperfect=1
# mean there is no in-kernel mixer and no virtual channels, so exactly one
# process can hold /dev/dsp.dac at a time.  A pulse server would take
# hw.snd.default_unit -- which IS the DAC -- and then BruteFIR (or MPD's direct
# output, or the browser) simply cannot open it.
#
# `autospawn` defaults to yes, and it is not only the desktop that trips it:
# ANY libpulse client spawns a server on demand, including Chromium's audio
# backend probe (its order is PulseAudio -> SNDIO -> ALSA).  So the first
# launch of a browser is enough to put a pulse server on the DAC.  Turn it off.
#
# This is a drop-in, not an edit of client.conf: client.conf is package-owned
# (pkg ships client.conf.sample), and pulse reads client.conf.d/*.conf after it.
# See cmake/browser-audio.cmake for the other half (the XDG autostart entry).
autospawn = no
