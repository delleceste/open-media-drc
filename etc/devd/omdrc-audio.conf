# Reconcile the complete audio state after a sound card appears or disappears.
#
# Match pcm, not USB interfaces: one UAC2 card exposes several USB interfaces
# but creates one pcm device.  Matching USB caused multiple transitions per
# plug and a broad detach rule could react to unrelated USB hardware.
#
# FreeBSD 15.1's current devd implementation waits for each direct action, but
# devd.conf(5) does not promise that concurrency model.  More importantly,
# daemon(8) intentionally detaches this bounded, idempotent rc action so slow
# audio work cannot block the machine-wide device-event loop.  The detached
# workers CAN overlap.  omdrc_audio therefore serializes the short root-owned
# role transaction, releases that lock, then drc.sh serializes the chain
# transition.  Repeated reconciles observe the corrected level state and exit.

attach 100 {
	device-name "pcm[0-9]+";
	action "/usr/sbin/daemon -f /usr/sbin/service omdrc_audio reconcile";
};

detach 100 {
	device-name "pcm[0-9]+";
	action "/usr/sbin/daemon -f /usr/sbin/service omdrc_audio reconcile";
};
