# Keep /dev/dsp.dac (and /dev/dsp.capture, when configured) pointing at the
# right sound card across hotplug.
# Install to: /usr/local/etc/devd/omdrc-sndlink.conf, then `service devd restart`
#
# Boot is NOT handled here: devd is started well after the USB bus is
# enumerated (its own rc.d script REQUIREs netif ldconfig), so it never sees the
# cards that were already present.  The omdrc_sndlink rc.d service does that
# pass, and both paths run the same `update` code.
#
# The trigger is the *pcm* attach rather than the USB one.  By the time the
# kernel announces "+pcm1 at ..." the unit is allocated and /dev/dsp1 exists, so
# the service can read the card's identity (dev.pcm.N.%parent ->
# dev.uaudio.N.%pnpinfo, giving vendor/product/serial) and link it in a single
# pass with nothing to poll for.  Matching the USB device instead -- system USB,
# subsystem DEVICE, type ATTACH with vendor/product -- fires before the pcm
# child exists and would need a retry loop to find it.
#
# `update` is a full rescan, so one rule covers both roles and the detach case
# (a link whose card is gone is removed, and a role that moved is repointed).
# It obeys omdrc_sndlink_enable: with the service disabled these are no-ops.

attach 100 {
	device-name "pcm[0-9]+";
	action "/usr/sbin/service omdrc_sndlink update";
};

detach 100 {
	device-name "pcm[0-9]+";
	action "/usr/sbin/service omdrc_sndlink update";
};
