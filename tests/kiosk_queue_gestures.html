<!doctype html>
<!-- Open in Chromium, or run with --headless --dump-dom --virtual-time-budget=2000. -->
<html><head><meta charset="utf-8"><title>Queue gesture regression</title>
<link rel="stylesheet" href="../omdrc-ctrl/src/kiosk/static/kiosk.css">
</head><body><div id="overlay-root"></div><pre id="result">RUNNING</pre>
<script src="../omdrc-ctrl/src/kiosk/static/core.js"></script>
<script src="../omdrc-ctrl/src/kiosk/static/pages/qobuz.js"></script>
<script>
(async () => {
    const assert = (condition, message) => { if (!condition) throw new Error(message); };
    const pointer = (row, type, x = 100, y = 100) => row.dispatchEvent(new PointerEvent(type, {
        bubbles: true, pointerType: 'touch', pointerId: 1, button: 0, clientX: x, clientY: y,
    }));
    const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));
    try {
        const page = K.pages.find(p => p.id === 'qobuz');
        const song = { id: '7', pos: 1, title: 'Track', album: 'Album', artist: 'Artist', duration: 120 };
        const player = K.h('div', { class: 'scrim qz-full' });
        document.getElementById('overlay-root').append(player);
        const row = page.queueRow(song);
        player.append(row);
        const edits = [], plays = [];
        page.editQueue = (action, song) => edits.push([action, song.id]);
        page.transport = action => plays.push(action);
        pointer(row, 'pointerdown');
        await sleep(600);
        const menu = document.querySelector('.qz-queue-menu');
        assert(menu, 'Long press must open the queue menu');
        const albumButton = [...menu.querySelectorAll('button')].find(b => b.textContent === 'Remove album');
        assert(albumButton, 'Album removal must be offered');
        const bounds = albumButton.getBoundingClientRect();
        const hit = document.elementFromPoint(bounds.x + bounds.width / 2, bounds.y + bounds.height / 2);
        assert(albumButton.contains(hit), 'Album removal must be visible and receive touches above the player');
        pointer(row, 'pointerup'); row.click();
        assert(!plays.length, 'Releasing a long press must not play the track');
        albumButton.click();
        assert(edits.length === 1 && edits[0][0] === 'remove_album' && edits[0][1] === '7', 'Album removal must target the held track');
        assert(!document.querySelector('.qz-queue-menu'), 'The menu must close after choosing an action');
        pointer(row, 'pointerdown'); pointer(row, 'pointermove', 100, 125); pointer(row, 'pointercancel');
        await sleep(600);
        assert(!document.querySelector('.qz-queue-menu'), 'Scrolling must cancel the long press');
        pointer(row, 'pointerdown'); pointer(row, 'pointerup'); row.click();
        assert(plays.length === 1, 'A normal tap must still play the track');
        player.remove();
        page.usable = () => true;
        page.makeView = () => ({ cover: K.h('div', { class: 'qz-pcover' }), title: K.h('div'), sub: K.h('div'), seekRow: K.h('div'), buttons: K.h('div', { class: 'qz-pbtns' }) });
        page.paintViews = () => {};
        page.playerPoll = { now() {} };
        K.SeekRing = class { destroy() {} };
        page.openFull();
        assert(page.fullView.infoBtn.parentElement === page.queueTools, 'Album details must share the queue header');
        const queue = Array.from({ length: 60 }, (_, i) => ({ ...song, id: String(i + 1), pos: i + 1 }));
        K.api = async () => ({ ok: true, version: 1, length: queue.length, songs: queue });
        page.now = { songid: '30', state: 'pause' };
        await page.loadQueue();
        const aligned = () => Math.abs(page.queueBox.querySelector('.on').getBoundingClientRect().top - page.queueBox.getBoundingClientRect().top - page.queueBox.clientTop) < 2;
        assert(page.queueBox.scrollHeight > page.queueBox.clientHeight, 'Queue must scroll within its own view');
        if (matchMedia('(orientation: portrait)').matches) {
            assert(page.fullEl.scrollHeight > page.fullEl.clientHeight, 'The cover and controls must scroll as part of the page');
            page.fullEl.scrollTop = page.fullEl.scrollHeight;
            assert(Math.abs(page.fullView.buttons.getBoundingClientRect().top - page.fullEl.getBoundingClientRect().top) < 3,
                'The outer page must stop when the transport reaches the top');
            page.fullEl.scrollTop = 0;
        }
        assert(aligned(), 'Opening while paused must align the current track at the top');
        page.now = { songid: '60', state: 'play' };
        page.markQueue();
        assert(aligned(), 'Changing to the last track must align it at the top');
        page.queueBox.scrollTop = 0;
        page.markQueue();
        assert(page.queueBox.scrollTop === 0, 'Polling the same track must preserve manual scrolling');
        page.now = { songid: '30', state: 'play' };
        page.markQueue();
        page.queueBox.scrollTop = page.queueBox.querySelector('.on').offsetTop + 150;
        const upward = { paused: false };
        page.scrollQueue(-10000, upward);
        assert(upward.paused && aligned(), 'Scrolling up from below must pause with the playing track at the top');
        assert(!page.queueAuto, 'A user scroll must disable automatic alignment');
        page.scrollQueue(-10000, { paused: false });
        assert(page.queueBox.scrollTop === 0, 'The next upward gesture must continue past the playing track');
        const downward = { paused: false };
        page.scrollQueue(10000, downward);
        const selected = page.queueBox.querySelector('.on').getBoundingClientRect();
        const viewport = page.queueBox.getBoundingClientRect();
        assert(downward.paused && Math.abs(selected.bottom - viewport.bottom) < 2, 'Scrolling down from above must pause with the playing track at the bottom');
        page.scrollQueue(10000, { paused: false });
        assert(page.queueBox.scrollTop > 0, 'The next downward gesture must continue past the playing track');
        const manualTop = page.queueBox.scrollTop;
        page.now = { songid: '42', state: 'play' };
        page.markQueue();
        assert(page.queueBox.scrollTop === manualTop, 'A song change must not move a queue the user has scrolled');
        await page.loadQueue();
        assert(page.queueBox.scrollTop === manualTop, 'A queue refresh must preserve manual scrolling');
        page.queueHead.click();
        assert(page.queueActions && page.queueHead.getAttribute('aria-expanded') === 'true', 'Queue header must open its dropdown');
        const clearAction = page.queueActions.querySelector('button');
        const actionBounds = clearAction.getBoundingClientRect();
        assert(clearAction.contains(document.elementFromPoint(actionBounds.x + 10, actionBounds.y + 10)), 'Clear action must receive touches');
        page.editQueue = action => edits.push([action]);
        clearAction.click();
        assert(edits.at(-1)[0] === 'clear' && !page.queueActions, 'Clear queue action must clear and dismiss');
        page.queueHead.click();
        page.fullKey({ key: 'Escape' });
        assert(!page.queueActions && page.fullEl, 'Escape must dismiss the dropdown first');
        page.queueHead.click();
        document.body.dispatchEvent(new PointerEvent('pointerdown', { bubbles: true }));
        assert(!page.queueActions, 'Outside tap must dismiss the dropdown');
        page.queueHead.click();
        page.closeFull();
        assert(!page.queueActions, 'Closing Now playing must remove the dropdown');
        document.getElementById('result').textContent = 'PASS';
    } catch (error) { document.getElementById('result').textContent = 'FAIL: ' + error.message; }
})();
</script></body></html>
