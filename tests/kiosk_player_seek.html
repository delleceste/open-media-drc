<!doctype html>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../omdrc-ctrl/src/kiosk/static/kiosk.css">
<div id="overlay-root"></div><pre id="result">RUNNING</pre>
<script src="../omdrc-ctrl/src/kiosk/static/core.js"></script>
<script src="../omdrc-ctrl/src/kiosk/static/widgets/icons.js"></script>
<script src="../omdrc-ctrl/src/kiosk/static/widgets/seekring.js"></script>
<script src="../omdrc-ctrl/src/kiosk/static/pages/qobuz.js"></script>
<script src="../omdrc-ctrl/src/kiosk/static/pages/now.js"></script>
<script>
(async () => {
    const check = (ok, message) => { if (!ok) throw Error(message); };
    const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));
    let clock = 10000;
    Object.defineProperty(performance, 'now', { value: () => clock });
    K.listening = K.listening || { icon: () => K.h('i'), open() {}, observe() {}, onChange() {} };
    if (!document.getElementById('topbar')) document.body.prepend(K.h('div', { id: 'topbar' }));
    const P = K.pages.find(p => p.id === 'qobuz');
    const calls = [];
    K.api = async (url, options) => { calls.push(options.json); return { ok: true }; };
    P.usable = () => true;
    P.player = P.player || K.h('div', { class: 'qz-player' }); document.body.append(P.player);
    P.playerPoll = { now() {} };
    P.now = { songid: '7', state: 'pause', title: 'Track' };
    P.base = { elapsed: 50, duration: 120, playing: false, at: clock };
    const pointer = (type, dx = 0, dy = 0) => {
        const cover = P.fullView.cover, r = cover.getBoundingClientRect();
        cover.dispatchEvent(new PointerEvent(type, { bubbles: true, cancelable: true, button: 0,
            pointerId: 1, pointerType: 'touch', clientX: r.left + r.width / 2 + dx, clientY: r.top + r.height / 2 + dy }));
    };
    try {
        P.openFull();
        check(!P.fullView.ring.shown, 'Opening must not automatically show the seek ring');
        const buttons = [...P.fullView.buttons.querySelectorAll('.qz-step')];
        check(buttons[0].textContent === '<<' && buttons.at(-1).textContent === '>>', 'Seek controls must surround the track controls');
        check(P.fullView.buttons.scrollWidth <= P.fullView.buttons.clientWidth + 1, 'Transport controls must fit the screen');
        P.fullView.cover.dataset.src = 'data:image/gif;base64,R0lGODlhAQABAAAAACw=';
        pointer('pointerdown'); pointer('pointerup');
        const max = document.querySelector('.cover-max');
        check(max && P.fullEl, 'A tap must maximise the cover, not minimize the player');
        {   // << / >> in the maximised cover seek at once, further when tapped faster
            const steps = max.querySelectorAll('.cover-max-step');
            check(steps.length === 2 && steps[0].textContent === '<<' && steps[1].textContent === '>>', 'Maximised cover has rewind and forward');
            const n = calls.length;
            steps[1].click(); await sleep(0);
            check(calls.length === n + 1 && calls.at(-1).seconds === 55, 'Maximised forward seeks five seconds at once');
            clock += 200; steps[1].click(); clock += 150; steps[1].click(); await sleep(0); await sleep(0);
            check(calls.at(-1).seconds === 90, 'Maximised taps build on each other and speed up');
            clock += 200; steps[0].click(); await sleep(0); await sleep(0);
            check(calls.at(-1).seconds < 90 && calls.at(-1).seconds > 60, 'Maximised rewind steps back');
            {   // held: seeks at once, then keeps going until released
                const n = calls.length, f = steps[1];
                f.dispatchEvent(new PointerEvent('pointerdown', { bubbles: true, button: 0, pointerId: 3 }));
                await sleep(1000);
                f.dispatchEvent(new PointerEvent('pointerup', { bubbles: true, button: 0, pointerId: 3 }));
                const held = calls.length - n; check(held >= 3, 'Holding a seek button repeats (got ' + held + ')');
                await sleep(600); check(calls.length - n === held, 'Releasing stops the repeat');
            }
            const touch = (type, y) => { const t = new Touch({ identifier: 1, target: max, clientX: 100, clientY: y });
                max.dispatchEvent(new TouchEvent(type, { bubbles: true, touches: type === 'touchend' ? [] : [t], changedTouches: [t] })); };
            touch('touchstart', 300); touch('touchend', 280);
            check(document.querySelector('.cover-max'), 'A short swipe up must not close');
            touch('touchstart', 300); touch('touchend', 180);
            check(!document.querySelector('.cover-max'), 'A swipe up closes the maximised cover');
            P.fullView.cover.dispatchEvent(new PointerEvent('pointerdown', { bubbles: true, button: 0, pointerId: 1, clientX: 50, clientY: 50 }));
            P.fullView.cover.dispatchEvent(new PointerEvent('pointerup', { bubbles: true, button: 0, pointerId: 1, clientX: 50, clientY: 50 }));
            check(document.querySelector('.cover-max'), 'reopened');
                        document.querySelector('.cover-max').querySelector('.cover-max-close').click();
            check(!document.querySelector('.cover-max'), 'Close closes the maximised cover');
            calls.length = 0;
        }
        P.closeFull(); P.openFull();
        pointer('pointerdown'); pointer('pointermove', 0, 80);
        check(P.fullEl.style.transform.includes('80px'), 'Pull must move the view down with the finger');
        pointer('pointerup', 0, 80); check(!P.fullEl, 'A downward swipe past the threshold must minimize');
        P.openFull(); pointer('pointerdown'); pointer('pointermove', 0, 20); pointer('pointerup', 0, 20);
        check(P.fullEl, 'A small downward swipe must not minimize');
        P.openFull(); pointer('pointerdown'); pointer('pointercancel');
        check(P.fullEl, 'A canceled touch must not minimize');
        const forward = P.fullView.buttons.querySelectorAll('.qz-step')[1];
        forward.click(); await sleep(0);
        check(calls.length === 1 && calls[0].seconds === 55 && P.fullView.ring.shown, 'First seek tap must seek five seconds at once');
        clock += 200; forward.click(); await sleep(0);
        check(calls.at(-1).seconds === 70, 'A repeat three times faster advances fifteen seconds');
        clock += 150; forward.click(); await sleep(0);
        check(calls.at(-1).seconds === 90, 'Faster repetition must increase the seek step');
        clock += 1000; forward.click(); await sleep(0);
        check(calls.at(-1).seconds === 95, 'Slower repetition must return to five seconds');
        for (let i = 0; i < 8; i++) { clock += 100; forward.click(); await sleep(0); }
        check(calls.at(-1).seconds === 119, 'Repeated forward seeking must stay before track end');
        const back = P.fullView.buttons.querySelector('.qz-step');
        const count = calls.length; back.click(); await sleep(0); check(calls.length === count + 1, 'Changing direction seeks at once');
        for (let i = 0; i < 10; i++) { clock += 100; back.click(); await sleep(0); }
        check(calls.at(-1).seconds === 0, 'Backward seeking must stop at track start');
        check(calls.every(c => c.action === 'seek' && c.seconds >= 0 && c.seconds < 120), 'Seeking must never request previous or next track');
        clock += 4001; back.click(); await sleep(0);
        check(calls.at(-1).seconds === 0, 'A new tap sequence seeks too');
        // Ring dragging still seeks.
        P.fullView.ring.show();
        pointer('pointerdown', 0, -P.fullView.cover.getBoundingClientRect().width * .44);
        pointer('pointermove', P.fullView.cover.getBoundingClientRect().width * .44, 0);
        pointer('pointerup', P.fullView.cover.getBoundingClientRect().width * .44, 0);
        await sleep(0);
        check(calls.at(-1).seconds === 30, 'Dragging the revealed ring must still seek');
        // a touch on the ring, anywhere round it, seeks there without a slide
        P.fullView.ring.show();
        pointer('pointerdown', 0, P.fullView.cover.getBoundingClientRect().width * .44);
        pointer('pointerup', 0, P.fullView.cover.getBoundingClientRect().width * .44);
        await sleep(0);
        check(calls.at(-1).seconds === 60, 'Touching the ring at 6 o\'clock must seek to half the track (got ' + calls.at(-1).seconds + ')');
        let release;
        K.api = async (url, options) => { calls.push(options.json); return new Promise(resolve => { release = resolve; }); };
        P.seekTaps = null; P.base.elapsed = 50; forward.click();
        clock += 200; forward.click();
        const inFlight = calls.length;
        clock += 150; forward.click(); clock += 150; forward.click();
        check(calls.length === inFlight, 'Rapid seek requests must be serialized');
        release({ ok: true }); await sleep(0);
        check(calls.at(-1).seconds === 110 && calls.length === inFlight + 1, 'Pending repeats must coalesce to the newest target');
        release({ ok: true }); await sleep(0);
        P.now.songid = '8'; const beforeTrack = calls.length;
        clock += 100; forward.click(); await sleep(0);
        check(calls.length === beforeTrack + 1 && calls.at(-1).seconds === P.base.elapsed, 'Track change must reset repeated seeking to five seconds');
        P.closeFull();
        // Mount the main Now page with its unrelated meters stubbed out.
        K.drGauge = () => {}; K.wireDrViewPopup = K.wireDrViewPopup || (() => {});
        K.DrBar = K.Balance = K.Spectrum = class {};
        K.VuMeter = class { setClips() {} };
        K.streams = { onLag() {} };
        K.drcState = { onChange() {} };
        const N = K.pages.find(p => p.id === 'now');
        N.drModeBox = () => K.h('div');
        const host = K.h('div', { style: 'width:100%;height:100dvh' }); document.body.append(host);
        N.mount(host);
        N.base = { elapsed: 50, duration: 120, playing: false, at: clock };
        N.track = { from: 'renderer', artist: 'Artist', title: 'Track', album: 'Album', duration: 120 };
        N.paintState('pause'); N.paintTime();
        check(getComputedStyle(N.state).borderTopColor === 'rgba(0, 0, 0, 0)',
            'Now play and pause control has no visible border');
        check(host.querySelector('.now-timebox').scrollWidth <= host.querySelector('.now-timebox').clientWidth + 1, 'Main Now controls and elapsed time must fit');
        const mainButtons = host.querySelector('.now-ctl');
        check(mainButtons.firstChild.textContent === '<<' && mainButtons.lastChild.textContent === '>>', 'Main Now controls include rewind and forward');
        const mainForward = mainButtons.lastChild;
        K.api = async (url, options) => { calls.push(options.json); return { ok: true }; };
        const beforeMain = calls.length; mainForward.click(); await sleep(0);
        check((K.portrait() ? N.ring.shown : N.progBox.classList.contains('seeking')) && calls.length === beforeMain + 1 && calls.at(-1).seconds === 55, 'Main Now first tap seeks five seconds at once');
        clock += 200; mainForward.click(); await sleep(0);
        check(calls.at(-1).seconds === 70, 'Main Now repeat seeks further');
        clock += 150; mainForward.click(); await sleep(0);
        check(calls.at(-1).seconds === 90, 'Main Now uses the same acceleration');
        N.ring.hide();
        const coverPointer = type => {
            const r = N.artBox.getBoundingClientRect();
            N.artBox.dispatchEvent(new PointerEvent(type, { bubbles: true, cancelable: true, button: 0,
                pointerId: 2, clientX: r.left + r.width / 2, clientY: r.top + r.height / 2 }));
        };
        N.ring.show();
        if (!K.portrait()) {
            const progress = N.progBox;
            check(parseFloat(getComputedStyle(progress).height) <= 6, 'Landscape progress bar stays a thin line, even while seeking');
            N.seekSlider.dispatchEvent(new PointerEvent('pointerdown', { bubbles: true }));
            N.seekSlider.value = 35; N.seekSlider.dispatchEvent(new Event('input', { bubbles: true }));
            N.paintTime();
            check(+N.seekSlider.value === 35, 'Polling must preserve the dragged slider position');
            N.seekSlider.dispatchEvent(new PointerEvent('pointerup', { bubbles: true }));
            check(+N.seekSlider.value === 35, 'Pointer release must preserve the selected seek value');
            N.seekSlider.dispatchEvent(new Event('change', { bubbles: true })); await sleep(0);
            check(calls.at(-1).action === 'seek' && calls.at(-1).seconds === 35, 'Releasing the slider seeks within the track');
            N.seekSlider.value = 45; N.seekSlider.dispatchEvent(new Event('input', { bubbles: true }));
            await sleep(4100);
            check(N.progBox.classList.contains('seeking'), 'Slider must stay expanded during a long drag');
            N.seekSlider.dispatchEvent(new PointerEvent('pointercancel', { bubbles: true }));
            await sleep(8100);
            check(!progress.classList.contains('seeking'), 'Inactive slider returns to the slim progress bar');
            mainForward.click();
            check(N.progBox.classList.contains('seeking'), 'Seek control reopens the slider');
            N.hideSeekSlider();
        }
        N.ring.destroy(); host.remove();
        document.getElementById('result').textContent = 'PASS';
    } catch (error) { document.getElementById('result').textContent = 'FAIL: ' + error.message; }
})();
</script>
