<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../omdrc-ctrl/src/kiosk/static/kiosk.css">
<div id="page" style="width:390px;max-width:100%"></div>
<div id="overlay-root"></div>
<pre id="result">RUNNING</pre>
<script src="../omdrc-ctrl/src/kiosk/static/core.js"></script>
<script src="../omdrc-ctrl/src/kiosk/static/widgets/icons.js"></script>
<script src="../omdrc-ctrl/src/kiosk/static/pages/qobuz.js"></script>
<script>
(async () => {
    const check = (ok, message) => { if (!ok) throw Error(message); };
    try {
        localStorage.clear();
        const P = K.pages.find(p => p.id === 'qobuz');
        K.state.features.qobuz_search = true;
        K.awardsBox = () => K.h('span', {});
        K.api = async url => url === '/qobuz/ai/settings'
            ? { ok: true, provider: 'claude', model: 'claude-sonnet-4-6', configured: true, account_ready: true,
                defaults: { claude: 'claude-sonnet-4-6', claude_account: 'claude-sonnet-4-6', openai: 'gpt-5.4' } }
            : { ok: true, entries: [] };
        const buildPlayer = P.buildPlayer;
        for (const name of ['buildPlayer', 'recent', 'loadGenres', 'loadWords']) P[name] = () => {};
        P.mount(document.getElementById('page'));
        check(P.viewChips.querySelector('[data-view=recent]').textContent === 'Recent', 'Recent label is compact');
        check(P.searchHint.querySelector('svg') && !P.searchHint.textContent.includes('Search'), 'Back to search uses a magnifier and chevron');
        check(P.searchHint.getAttribute('aria-label') === 'Back to search', 'Search icon has an accessible label');
        P.setAIMode(true);
        check(P.fsum.querySelector('.qz-fsum-mark svg'), 'AI filters use a funnel icon');
        check(!P.fsum.classList.contains('qz-filtered'), 'Default AI icon is not active');
        P.qualityBox.querySelector('button').click();
        const yellow = getComputedStyle(P.fsum).getPropertyValue('--yellow').trim();
        const probe = K.h('span', { style: `color: ${yellow}` });
        P.fsum.append(probe);
        check(getComputedStyle(P.fsum.querySelector('.qz-fsum-mark')).color === getComputedStyle(probe).color, 'Active AI filter icon is yellow');
        probe.remove();
        P.resetFilters();
        check(!P.fsum.classList.contains('qz-filtered'), 'Cleared AI filters restore icon color');
        P.setAIMode(false);
        check(P.fsum.querySelector('.qz-fsum-mark').textContent.includes('Filters'), 'Normal mode retains Filters text');

        P.input.value = 'Three Beethoven 5 recordings for sound engineering';
        check(!P.form.textContent.includes('AI settings'), 'Settings removed from search');
        check(!P.form.querySelector('[aria-label="Number of AI recommendations"]'), 'No fixed count selector');
        check(!P.params(0).has('hires'), 'Hi-Res initially off');
        P.qualityBox.querySelector('button').click();
        check(P.params(0).get('hires') === '1', 'Enabled Hi-Res sent to backend');
        const card = (id, rank) => ({ id, title: 'Beethoven: Symphony No. 5', artist: 'Orchestra', label: 'BIS',
            date: '2025-01-01', year: 2025, bits: 24, rate: 96, awards: [], performers: [],
            ai: { rank, reason: '<img src=x onerror=alert(1)> Excellent engineering.', uncertain: false,
                sources: [{ url: 'https://reviews.example/recording', title: 'Review source' }] } });
        let calls = 0;
        P.aiPost = async (url, body) => {
            calls++;
            check(url.includes('hires=1'), 'AI respects Hi-Res');
            check(!('count' in body) && body.prompt.includes('Beethoven'), 'AI count and prompt');
            return { ok: true, results: [card('a', 0), card('b', 1), card('c', 2)], count: 3,
                considered: 9, queries: [], window: { from: '', to: '' }, sort: 'ai', labels_seen: [],
                more: false, ai: { requested: 3, summary: 'Review-based recommendations.' } };
        };
        await P.toggleAI();
        check(P.aiToggle.getAttribute('aria-pressed') === 'true', 'AI mode enabled');
        check(!P.params(0).has('hires') && !P.fsum.classList.contains('qz-filtered'), 'AI clears filters');
        check(!P.fsum.textContent.includes('Filters Applied'), 'Reset removes applied label');
        P.qualityBox.querySelector('button').click();
        check(P.fsum.classList.contains('qz-filtered'), 'Active filters marked');
        check(P.fsum.querySelector('.qz-fsum-mark svg'), 'AI filter icon retained');
        check(P.filterSummary() === 'Hi-Res: exclude 16/44.1', 'Summary omits default settings');
        check(P.fsum.querySelector('[aria-label="Clear filters"] svg'), 'Clear filters uses an icon');
        check(P.input.tagName === 'TEXTAREA', 'AI uses multiline input');
        P.input.value += '\nPrefer complete albums';
        const enter = new KeyboardEvent('keydown', { key: 'Enter', bubbles: true, cancelable: true });
        P.input.dispatchEvent(enter);
        check(!enter.defaultPrevented, 'AI Enter remains a newline');
        P.openFilters(true);
        check(P.fsum.querySelector('.qz-fsum-mark svg'), 'AI filter icon retained when expanded');
        P.openFilters(false);
        await P.go();
        check(P.results.querySelectorAll('.qz-row').length === 3, 'Three album result cards');
        check(P.results.querySelectorAll('.qz-play').length === 3, 'Playable controls');
        check(P.results.querySelectorAll('.qz-ai-sources a').length === 3, 'Linked sources');
        check(!P.results.querySelector('.qz-ai-reason img'), 'AI text is safely rendered');
        check(P.results.textContent.includes('AI recommendations'), 'Recommendation order label');
        check(P.request === null && !P.aiButton.disabled, 'Busy state cleared');
        P.syncAILowered([{ kind: 'label', key: 'bis', name: 'BIS' }]);
        check(P.last.results.every(c => c.lowered), 'Lowering applies to AI results');
        P.syncAILowered([]);
        check(P.last.results.every(c => !c.lowered), 'Restoring AI results');
        check(P.last.results.map(c => c.id).join('') === 'abc', 'AI order retained after restoring');
        P.qualityBox.querySelector('button').click();
        await new Promise(resolve => setTimeout(resolve, 550));
        check(calls === 1, 'Filter change does not trigger paid AI calls');
        let finishOld;
        P.aiPost = () => new Promise(resolve => { finishOld = resolve; });
        const running = P.go();
        await Promise.resolve();
        check(P.aiButton.getAttribute('aria-label') === 'Stop search' && !P.aiButton.disabled, 'Stop available during AI search');
        check(P.aiToggle.disabled, 'AI toggle disabled during search');
        const stopIcon = P.aiButton.querySelector('svg.ticon');
        check(stopIcon && !P.aiButton.textContent.trim(), 'Stop uses an SVG icon without a letter');
        const buttonRect = P.aiButton.getBoundingClientRect(), iconRect = stopIcon.getBoundingClientRect();
        check(Math.abs((buttonRect.top + buttonRect.bottom - iconRect.top - iconRect.bottom) / 2) < 1,
            'Stop icon vertically centered');
        check(Math.abs((buttonRect.left + buttonRect.right - iconRect.left - iconRect.right) / 2) < 1,
            'Stop icon horizontally centered');
        const finishFirst = finishOld;
        const oldController = P.searchController;
        P.go();
        check(oldController.signal.aborted && !P.request, 'Stop aborts request');
        check(P.aiButton.getAttribute('aria-label') === 'Search' && !P.aiToggle.disabled, 'Controls restored after stop');
        P.input.value = 'Replacement search';
        const replacement = P.go();
        await Promise.resolve();
        const finishNew = finishOld;
        check(P.aiButton.getAttribute('aria-label') === 'Stop search', 'Replacement starts immediately');
        P.stopSearch();
        finishNew({ ok: false, error: 'late response' });
        await replacement;
        check(!P.results.textContent.includes('late response'), 'Stopped response ignored');
        finishFirst({ ok: false, error: 'older response' });
        await running;
        check(!P.results.textContent.includes('older response'), 'Older response ignored');
        P.mounted = true;
        const dock = K.h('div', {});
        document.getElementById('page').append(dock);
        K.qobuzDock(dock);
        let entryScroll;
        const nativeScroll = P.el.scrollTo;
        P.el.scrollTo = options => { entryScroll = options; };
        P.prepareEnter('now');
        check(!P.dockedOnNow(), 'Form restored before page transition');
        check(entryScroll && entryScroll.behavior === 'instant', 'Search scrolled out before transition');
        P.el.scrollTo = nativeScroll;
        let finishSettings;
        const settingsAPI = K.api;
        K.api = () => new Promise(resolve => { finishSettings = resolve; });
        const starting = P.go();
        check(P.aiButton.getAttribute('aria-label') === 'Stop search', 'Settings lookup can be stopped');
        P.go();
        finishSettings({ ok: true, configured: true });
        await starting;
        check(!P.request && !P.aiStarting, 'Stopped settings lookup cannot start research');
        K.api = settingsAPI;
        P.setAIMode(false);
        const NativeEventSource = window.EventSource;
        let stream;
        window.EventSource = class {
            constructor() { stream = this; }
            close() { this.closed = true; }
        };
        const catalogSearch = P.search();
        check(P.aiButton.getAttribute('aria-label') === 'Stop search' && P.aiToggle.disabled, 'Catalog search has Stop');
        P.go();
        await catalogSearch;
        check(stream.closed && !P.request, 'Stop closes catalog stream');
        stream.onmessage({ data: JSON.stringify({ ok: true, partial: true, results: [] }) });
        check(P.aiButton.getAttribute('aria-label') === 'Search', 'Late stream event does not restart search');
        window.EventSource = NativeEventSource;
        P.setAIMode(true);
        K.api = async () => ({ ok: true, configured: false, provider: 'claude', model: '', account_ready: true, defaults: {} });
        await P.toggleAI();
        P.qualityBox.querySelector('button').click();
        check(P.fsum.classList.contains('qz-filtered'), 'Active filter before unconfigured toggle');
        await P.toggleAI();
        check(P.aiToggle.getAttribute('aria-pressed') === 'false', 'Unconfigured AI stays off');
        check(!P.aiToggle.disabled, 'Toggle available after configuration check');
        check(P.fsum.classList.contains('qz-filtered'), 'Unconfigured toggle preserves filters');
        check(calls === 1, 'Unconfigured AI makes no paid request');
        check(document.querySelector('[role=dialog]').textContent.includes('Configure an AI provider'), 'Missing configuration dialog');
        check(document.querySelector('.qz-ai-sheet select').value === 'claude', 'Claude selected in settings');
        check(document.querySelector('.qz-ai-sheet input[type=password]').value === '', 'Key never returned');
        const provider = document.querySelector('.qz-ai-sheet select');
        provider.value = 'claude_account'; provider.dispatchEvent(new Event('change'));
        check(document.querySelector('.qz-ai-sheet input[type=password]').parentElement.hidden, 'Account mode needs no API key');
        check(document.querySelector('.qz-ai-sheet').textContent.includes('Claude is signed in'), 'Account login status displayed');
        buildPlayer();
        check(!P.player.querySelector('.qz-expand'), 'No adjacent expand button');
        const openFull = P.openFull;
        let opened = 0;
        P.openFull = ({ offset = 0 } = {}) => {
            opened++;
            P.fullEl = K.h('div', {});
            P.fullEl.style.transform = `translateY(${offset}px)`;
        };
        P.player.setPointerCapture = () => {};
        const info = P.player.querySelector('.qz-pinfo');
        info.click();
        check(opened === 1, 'Bar tap opens player');
        P.fullEl = null;
        const pointer = (type, y) => info.dispatchEvent(new PointerEvent(type,
            { bubbles: true, pointerId: 42, pointerType: 'touch', button: 0, clientY: y }));
        pointer('pointerdown', 700);
        pointer('pointermove', 650);
        const firstOffset = P.fullEl.style.transform;
        pointer('pointermove', 500);
        check(firstOffset !== P.fullEl.style.transform, 'Drawer follows upward drag progressively');
        pointer('pointerup', 500);
        check(P.fullEl.style.transform === 'translateY(0px)', 'Long swipe opens drawer');
        info.click();
        check(opened === 2, 'Swipe does not also trigger a tap');
        P.fullEl = null;
        pointer('pointerdown', 700); pointer('pointermove', 680); pointer('pointerup', 680);
        check(P.fullEl.style.transform === 'translateY(100dvh)', 'Short swipe returns drawer');
        await new Promise(resolve => setTimeout(resolve, 200));
        check(!P.fullEl, 'Returned drawer removed');
        let transport = 0;
        P.transport = () => { transport++; };
        P.player.querySelector('.qz-toggle').click();
        check(transport === 1 && opened === 3, 'Play button does not open drawer');
        P.openFull = openFull;
        check(getComputedStyle(P.aiButton).backgroundColor !== 'rgb(31, 111, 235)', 'Search has no blue fill');
        P.resetFilters();
        check(P.filterSummary() === '', 'Defaults have no filter summary');
        K.setPref('qobuz.order', 'date'); P.paintSort();
        check(P.filterSummary() === 'newest first', 'Only newest-first summarized');
        P.fsum.querySelector('[aria-label="Clear filters"]').click();
        check(!P.filtersActive(), 'Clear icon resets all filters');
        P.input.value = 'abcdefghijklmnop';
        P.searchedKey = P.params(0).toString(); P.previewDismissed = false;
        P.paintPreview('Preview');
        P.input.value = 'abcdefghijklm'; P.input.dispatchEvent(new Event('input'));
        check(!P.preview.hidden, 'Small deletion retains preview');
        P.input.value = 'abcdefghijkl'; P.input.dispatchEvent(new Event('input'));
        check(P.preview.hidden, 'Quarter deletion hides preview');
        P.paintPreview('Late search result');
        check(P.preview.hidden, 'Late response cannot restore dismissed preview');
        P.previewDismissed = false; P.paintPreview('Preview');
        P.input.value = ''; P.input.dispatchEvent(new Event('input'));
        check(P.preview.hidden, 'Clearing text hides preview');
        P.previewDismissed = false; P.paintPreview('Preview');
        const showPage = K.showPage;
        K.showPage = () => check(P.preview.hidden, 'Preview hidden before switching pages');
        P.openResults();
        K.showPage = showPage;
        P.previewDismissed = false; P.paintPreview('Preview');
        P.prepareEnter('now');
        check(P.preview.hidden, 'Swipe into results dismisses preview immediately');
        check(P.form.scrollWidth <= 392, 'Phone-width layout fits');
        document.getElementById('result').textContent = 'PASS: player tap, progressive swipe, short-swipe cancel, separate playback, neutral search, search stop, restart, late responses, catalog stream, AI cards, playback controls, sources, safe text, Hi-Res, settings, restoring and no automatic paid requests';
    } catch (error) { document.getElementById('result').textContent = 'FAIL: ' + error.stack; }
})();
</script>
