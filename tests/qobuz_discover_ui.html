<!doctype html>
<meta charset="utf-8">
<link rel="stylesheet" href="../omdrc-ctrl/src/kiosk/static/kiosk.css">
<div id="page" style="width:390px"></div><div id="overlay-root"></div><pre id="result">RUNNING</pre>
<script src="../omdrc-ctrl/src/kiosk/static/core.js"></script>
<script src="../omdrc-ctrl/src/kiosk/static/widgets/icons.js"></script>
<script src="../omdrc-ctrl/src/kiosk/static/pages/qobuz.js"></script>
<script>
(async () => {
    const check = (ok, message) => { if (!ok) throw Error(message); };
    try {
        localStorage.clear();
        K.state.features.qobuz_search = true;
        K.library = { mount() {}, show() {}, hide() {}, visible: false };
        K.api = async () => ({ ok: true, entries: [] });
        const P = K.pages.find(p => p.id === 'qobuz');
        for (const name of ['buildPlayer', 'recent', 'loadGenres', 'loadWords']) P[name] = () => {};
        P.mount(document.getElementById('page'));
        P.favourites = ['Decca', ...Array.from({ length: 28 }, (_, i) => `Long label ${i + 1}`)];
        P.paintLabels();
        P.paintDiscoverFilters();
        P.openFilters(true);
        P.discoverBox.hidden = false;
        P.openDiscoverFilters(true);
        check(!P.discoverFilters.hidden && P.discoverFilterBtn.getAttribute('aria-expanded') === 'true',
            'Discover filters open beside Genre');
        check(P.labelsScroll.scrollHeight > P.labelsScroll.clientHeight &&
            P.discoverLabelsScroll.scrollHeight > P.discoverLabelsScroll.clientHeight,
            'Both label lists scroll after four rows');
        check(P.labelsBox.querySelector('[aria-label="Add search label"]').parentElement === P.labelsBox &&
            P.discoverLabels.querySelector('[aria-label="Add Discover label"]').parentElement === P.discoverLabels,
            'Add buttons stay outside the scrolling label lists');
        const calls = [];
        K.api = async url => {
            calls.push(url);
            return { ok: true, albums: [], more: false };
        };
        P.discoverLabels.querySelector('[aria-label="Add Discover label"]').click();
        let dialog = document.querySelector('[aria-label="Add label"]');
        dialog.querySelector('input').value = 'BIS Records';
        dialog.requestSubmit();
        check(K.pref('qobuz.discoverLabels', []).includes('BIS Records') &&
            P.labelsBox.textContent.includes('BIS Records'), 'Discover adds a reusable custom label');
        P.labelsBox.querySelector('[aria-label="Add search label"]').click();
        dialog = document.querySelector('[aria-label="Add label"]');
        dialog.querySelector('input').value = 'Alpha Classics';
        dialog.requestSubmit();
        check(K.pref('qobuz.labels', []).includes('Alpha Classics') &&
            P.discoverLabels.textContent.includes('Alpha Classics'), 'Search adds a reusable custom label');
        check(!K.pref('qobuz.labels', []).includes('BIS Records') &&
            !K.pref('qobuz.discoverLabels', []).includes('Alpha Classics'),
            'Search and Discover retain separate label selections');
        P.discoverLabels.querySelector('button').click();
        P.discoverAwarded.querySelector('button').click();
        P.discoverQuality.querySelector('button').click();
        await P.discover();
        const url = calls.at(-1);
        check(url.includes('label=Decca') && url.includes('label=BIS+Records') &&
            url.includes('awarded=1') && url.includes('hires=1'),
            'Discover sends all filters');
        check(P.discoverList.textContent.includes('New releases') &&
            P.discoverList.textContent.includes('BIS Records · Decca · awarded · Hi-Res'),
            'Short filter summary appears beside New releases');
        check(!P.discoverFilters.textContent.includes('Released') && !P.discoverFilters.textContent.includes('Order'),
            'Discover omits date and order filters');
        const scrolls = [];
        P.visible = true;
        P.el.scrollTo = options => scrolls.push(options);
        window.requestAnimationFrame = callback => callback();
        for (const view of ['results', 'recent', 'discover', 'awarded', 'library']) {
            P.viewChips.querySelector(`[data-view="${view}"]`).click();
        }
        check(scrolls.length === 5 && scrolls.every(s => s.behavior === 'smooth'),
            'Every Qobuz view button scrolls past the search box');
        document.getElementById('result').textContent = 'PASS';
    } catch (error) { document.getElementById('result').textContent = 'FAIL: ' + error.stack; }
})();
</script>
