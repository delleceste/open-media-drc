<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../omdrc-ctrl/src/kiosk/static/kiosk.css">
<div id="page" style="width:390px;max-width:100%"></div>
<div id="overlay-root"></div>
<pre id="result">RUNNING</pre>
<script src="../omdrc-ctrl/src/kiosk/static/core.js"></script>
<script src="../omdrc-ctrl/src/kiosk/static/widgets/icons.js"></script>
<script src="../omdrc-ctrl/src/kiosk/static/pages/qobuz.js"></script>
<script>
(async () => {
    const check = (ok, message) => { if (!ok) throw Error(message); };
    try {
        const P = K.pages.find(p => p.id === 'qobuz');
        const choices = { claude_account: ['sonnet', 'opus', 'fable', 'haiku'], claude: ['claude-sonnet-5-5'], openai: ['gpt-5.4'] };
        const settings = model => async () => ({ ok: true, provider: 'claude_account', model, configured: true, account_ready: true,
            defaults: { claude_account: 'sonnet', claude: 'claude-sonnet-5-5', openai: 'gpt-5.4' }, choices });
        let saved;
        P.aiPost = async (_url, body) => { saved = body; return { ok: true, configured: true, provider: body.provider }; };
        P.paintAIIcon = () => {};
        const open = async model => {
            document.getElementById('overlay-root').textContent = '';
            K.api = settings(model);
            await P.aiSettings();
            const dialog = document.querySelector('.qz-ai-sheet');
            const [provider, model_] = dialog.querySelectorAll('select');
            return { dialog, provider, model: model_, custom: dialog.querySelector('input[aria-label="Exact model name"]'),
                     save: [...dialog.querySelectorAll('button')].find(b => b.textContent === 'Save') };
        };
        let ui = await open('sonnet');
        check([...ui.model.options].map(o => o.value).join() === 'sonnet,opus,fable,haiku,', 'Account tiers plus Other');
        check(ui.model.value === 'sonnet' && ui.custom.hidden, 'Alias selected, exact name hidden');
        check(ui.dialog.textContent.includes('moves to each new model'), 'Alias hint shown');
        ui.model.value = 'opus'; ui.model.dispatchEvent(new Event("change"));
        ui.save.click(); await new Promise(r => setTimeout(r));
        check(saved.model === 'opus', 'Chosen alias saved');
        ui = await open('claude-sonnet-4-6');
        check(ui.model.value === '' && !ui.custom.hidden && ui.custom.value === 'claude-sonnet-4-6', 'Pinned name shown under Other');
        ui.save.click(); await new Promise(r => setTimeout(r));
        check(saved.model === 'claude-sonnet-4-6', 'Pinned name kept on save');
        ui.provider.value = 'openai'; ui.provider.dispatchEvent(new Event("change"));
        check(ui.model.value === 'gpt-5.4' && ui.custom.hidden, 'Provider change selects its default');
        check(!ui.dialog.textContent.includes('moves to each new model'), 'Alias hint only in account mode');
        document.getElementById('result').textContent = 'PASS';
    } catch (error) { document.getElementById('result').textContent = 'FAIL: ' + error.stack; }
})();
</script>
