<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Verified DRC response</title>
    <script src="{{ url_for('static', filename='chart.umd.min.js') }}"></script>
    <script src="{{ url_for('static', filename='filter-response-smoothing.js') }}"></script>
    <style>
        :root {
            --bg:#0d1117; --panel:#161b22; --border:#30363d;
            --text:#e6edf3; --muted:#8b949e; --accent:#388bfd;
            --good:#3fb950; --bad:#f85149; --warn:#d29922;
        }
        * { box-sizing:border-box; }
        body {
            margin:0; padding:18px; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
            background:var(--bg); color:var(--text);
        }
        .topbar { display:flex; align-items:center; gap:14px; flex-wrap:wrap; margin-bottom:14px; }
        h1 { font-size:1.25rem; margin:0; }
        a.back { color:var(--accent); text-decoration:none; font-size:.85rem; }
        a.back:hover { text-decoration:underline; }
        .meta { color:var(--muted); font-size:.8rem; }
        .spacer { flex:1; }
        button {
            background:var(--panel); color:var(--text); border:1px solid var(--border);
            border-radius:6px; padding:6px 11px; font-size:.8rem; cursor:pointer;
        }
        button:hover, button.active { border-color:var(--accent); color:#fff; background:#1f6feb33; }
        .smoothing-control { display:flex; align-items:center; gap:7px; color:var(--muted); font-size:.8rem; }
        select {
            background:var(--panel); color:var(--text); border:1px solid var(--border);
            border-radius:6px; padding:6px 25px 6px 9px; font-size:.8rem; cursor:pointer;
        }
        select:hover, select:focus { border-color:var(--accent); outline:none; }
        #status { color:var(--muted); font-size:.9rem; padding:26px 4px; line-height:1.5; }
        #status.error { color:var(--bad); }
        .verification {
            display:flex; align-items:flex-start; gap:10px; padding:10px 12px; margin-bottom:14px;
            border:1px solid var(--border); border-radius:8px; background:var(--panel); font-size:.82rem;
        }
        .verification.verified { border-color:#238636; background:#14261a; }
        .verification.mismatch { border-color:#da3633; background:#2d1619; }
        .badge { font-weight:700; text-transform:uppercase; letter-spacing:.04em; white-space:nowrap; }
        .verified .badge { color:var(--good); }
        .mismatch .badge { color:var(--bad); }
        .controls, .legend { display:flex; align-items:center; flex-wrap:wrap; gap:8px 14px; }
        .controls { margin:0 0 10px; }
        .legend {
            padding:10px 12px; background:var(--panel); border:1px solid var(--border);
            border-radius:8px; margin-bottom:14px; font-size:.78rem;
        }
        .legend-group { color:var(--muted); font-weight:600; margin-left:4px; }
        .legend label { display:flex; align-items:center; gap:5px; cursor:pointer; white-space:nowrap; }
        .legend input { accent-color:var(--accent); }
        .swatch { width:15px; height:3px; border-radius:2px; display:inline-block; }
        .chart-card, details {
            background:var(--panel); border:1px solid var(--border); border-radius:10px;
            padding:12px 14px; margin-bottom:14px;
        }
        .chart-card h2 { font-size:.9rem; margin:0 0 8px; }
        .sub { font-size:.72rem; color:var(--muted); font-weight:400; }
        .wrap { position:relative; height:min(62vh,540px); min-height:330px; }
        .note { color:var(--muted); font-size:.74rem; line-height:1.55; margin-top:9px; }
        details summary { cursor:pointer; font-size:.86rem; font-weight:600; }
        .detail-grid {
            display:grid; grid-template-columns:max-content 1fr; gap:5px 12px;
            margin:12px 0; font-size:.76rem; line-height:1.45;
        }
        .detail-grid dt { color:var(--muted); }
        .detail-grid dd { margin:0; overflow-wrap:anywhere; }
        pre {
            white-space:pre-wrap; overflow-wrap:anywhere; color:var(--muted); font-size:.7rem;
            border-top:1px solid var(--border); padding-top:10px; max-height:420px; overflow:auto;
        }
        @media (max-width:620px) {
            body { padding:12px; }
            .detail-grid { grid-template-columns:1fr; gap:2px; }
            .detail-grid dd { margin-bottom:7px; }
        }
    </style>
</head>
<body>
    <div class="topbar">
        <a class="back" href="/">← Back</a>
        <h1>Verified DRC response</h1>
        <span class="meta" id="meta"></span>
        <span class="spacer"></span>
        <button onclick="load()">↻ Refresh</button>
    </div>

    <div id="status">Loading active filter and provenance…</div>
    <main id="content" hidden>
        <div id="verification" class="verification"></div>
        <div class="controls">
            <button id="mode-mag" class="active" onclick="setMode('magnitude_db')">Magnitude</button>
            <button id="mode-phase" onclick="setMode('phase_deg')">Phase</button>
            <label class="smoothing-control" for="smoothing-select">Smoothing
                <select id="smoothing-select" title="Display-only smoothing applied in the browser; the stored REW exports are unchanged" onchange="setSmoothing(this.value)">
                    <option value="none">Unsmoothed (as exported)</option>
                    <option value="variable">Variable</option>
                    <option value="psychoacoustic">Psychoacoustic</option>
                    <option value="octave-3">1/3 octave</option>
                    <option value="octave-6">1/6 octave</option>
                </select>
            </label>
        </div>
        <div id="legend" class="legend"></div>
        <section class="chart-card">
            <h2 id="chart-title">Magnitude <span class="sub">— dB vs frequency</span></h2>
            <div class="wrap"><canvas id="response-chart"></canvas></div>
            <div class="note" id="note"></div>
        </section>
        <details id="details-card" hidden>
            <summary>Provenance and audit details</summary>
            <dl class="detail-grid" id="detail-grid"></dl>
            <pre id="detail-json"></pre>
        </details>
    </main>

<script>
const FREQ_TICKS = [10,20,50,100,200,500,1000,2000,5000,10000,20000];
let responseData = null;
let responseChart = null;
let mode = 'magnitude_db';
let smoothing = 'none';
let traces = [];
let responseNote = '';

const SMOOTHING_LABELS = {
    none:'Unsmoothed', variable:'Variable', psychoacoustic:'Psychoacoustic',
    'octave-6':'1/6 octave', 'octave-3':'1/3 octave',
};

function el(name, text) {
    const node = document.createElement(name);
    if (text !== undefined) node.textContent = text;
    return node;
}

// Each trace names the frequency grid its own export was written on. Traces
// that share a bit-identical grid share one stored array; nothing is resampled.
function buildTraceList(data) {
    return (data.traces || []).map(t => ({
        ...t, freqs:data.frequency_grids[t.grid], selected:!!t.default_visible,
    }));
}

function renderLegend() {
    const legend = document.getElementById('legend');
    legend.replaceChildren();
    let lastGroup = '';
    traces.forEach((trace, index) => {
        if (trace.group !== lastGroup) {
            legend.appendChild(el('span', trace.group));
            legend.lastChild.className = 'legend-group';
            lastGroup = trace.group;
        }
        const label = el('label');
        const input = document.createElement('input');
        input.type = 'checkbox'; input.checked = trace.selected;
        input.addEventListener('change', () => { traces[index].selected = input.checked; draw(); });
        const swatch = el('span'); swatch.className = 'swatch'; swatch.style.background = trace.color;
        label.append(input, swatch, document.createTextNode(trace.label));
        legend.appendChild(label);
    });
}

function setMode(next) {
    mode = next;
    document.getElementById('mode-mag').classList.toggle('active', mode === 'magnitude_db');
    document.getElementById('mode-phase').classList.toggle('active', mode === 'phase_deg');
    draw();
}

function setSmoothing(next) {
    smoothing = next;
    draw();
}

// Smoothing is a viewing aid computed here in the browser, on a copy. The
// stored arrays, their hashes and the default view stay exactly as REW
// exported them.
function displaySeries(trace) {
    if (!trace.displayCache) trace.displayCache = {};
    const key = `${mode}:${smoothing}`;
    if (!trace.displayCache[key]) {
        trace.displayCache[key] = FilterResponseSmoothing.smoothTrace(
            trace.freqs, trace[mode], mode, smoothing);
    }
    return trace.displayCache[key];
}

function updateNote() {
    const visual = smoothing === 'none'
        ? 'The view is unsmoothed, so the graph holds exactly the exported numbers.'
        : `${SMOOTHING_LABELS[smoothing]} smoothing is applied to this view only; `
          + 'switch to Unsmoothed to read the exported numbers again.';
    document.getElementById('note').textContent = `${responseNote} ${visual}`;
}

function draw() {
    if (!responseData) return;
    const phase = mode === 'phase_deg';
    document.getElementById('chart-title').innerHTML = phase
        ? `Phase <span class="sub">— wrapped degrees vs frequency · ${SMOOTHING_LABELS[smoothing]}</span>`
        : `Magnitude <span class="sub">— room curves are SPL, filter curves are gain · ${SMOOTHING_LABELS[smoothing]}</span>`;
    const datasets = traces.filter(t => t.selected).map(t => {
        const series = displaySeries(t);
        return {
            label:t.label, borderColor:t.color, backgroundColor:t.color,
            borderDash:t.dash || [],
            data:series.frequencies.map((frequency, index) => ({x:frequency, y:series.values[index]})),
        };
    });
    if (responseChart) responseChart.destroy();
    responseChart = new Chart(document.getElementById('response-chart'), {
        type:'line', data:{datasets}, options:{
            responsive:true, maintainAspectRatio:false, animation:false, parsing:false,
            interaction:{mode:'nearest', intersect:false},
            scales:{
                x:{type:'logarithmic', min:10, max:20000,
                   title:{display:true,text:'Frequency (Hz)',color:'#8b949e'},
                   ticks:{color:'#8b949e',autoSkip:false,maxRotation:0,
                          callback:v=>FREQ_TICKS.includes(v)?(v>=1000?(v/1000)+'k':v):''},
                   grid:{color:'rgba(139,148,158,.15)'}},
                y:{min:phase?-180:undefined,max:phase?180:undefined,
                   title:{display:true,text:phase?'Phase (°)':'Level / gain (dB)',color:'#8b949e'},
                   ticks:{color:'#8b949e',stepSize:phase?90:undefined},
                   grid:{color:'rgba(139,148,158,.15)'}},
            },
            plugins:{legend:{display:false},tooltip:{callbacks:{
                title:items=>items.length?Math.round(items[0].parsed.x)+' Hz':'',
            }}},
            elements:{point:{radius:0},line:{borderWidth:1.55,tension:0}},
        }
    });
    updateNote();
}

function addDetail(term, description) {
    const grid = document.getElementById('detail-grid');
    grid.append(el('dt', term), el('dd', description));
}

function renderDetails(data) {
    const card = document.getElementById('details-card');
    const grid = document.getElementById('detail-grid');
    grid.replaceChildren();
    if (!data.details) { card.hidden = true; return; }
    const d = data.details;
    addDetail('Bundle', d.bundle_id);
    addDetail('Active', `${data.conf} · ${data.rate.toLocaleString()} Hz · ${d.design_id || d.variant}`);
    addDetail('Design description', d.description || d.design_id || d.variant);
    addDetail('Runtime hashes', `L ${data.verification.active_hashes.left} · R ${data.verification.active_hashes.right}`);
    addDetail('Source directory', d.source_directory);
    const project = d.project || {};
    if (project.name) {
        addDetail('Source project', project.commit
            ? `${project.name} @ ${project.commit.slice(0, 12)}` +
              (project.clean ? '' : ' — exports were NOT committed')
            : `${project.name} — not under version control`);
    }
    const session = d.session || {};
    if (session.file) {
        addDetail('REW session', `${session.file} (sha256 ${session.sha256.slice(0, 16)})`);
    }
    addDetail('Aggregate', (d.aggregate.style === 'LR'
        ? 'REW vector average of L and R'
        : 'L+R sum') + (d.aggregate.corrected === 'remeasured'
            ? ' — corrected curve re-measured in the room'
            : ' — corrected curve is REW\u2019s filtered result'));
    addDetail('Exports plotted', Object.entries(d.artifacts)
        .filter(([role]) => !role.endsWith('_wav'))
        .map(([, item]) => `${item.path} (${item.sha256.slice(0, 12)})`).join(' · '));
    addDetail('Measurements', Object.values(d.measurements)
        .map(m => `${m.measurement} (${m.dated}, REW smoothing: ${m.smoothing || 'unstated'})`)
        .join(' · '));
    addDetail('Processing', d.calculation.note);
    document.getElementById('detail-json').textContent = JSON.stringify(d, null, 2);
    card.hidden = false;
}

async function load() {
    const status = document.getElementById('status');
    const content = document.getElementById('content');
    status.className = ''; status.hidden = false; status.textContent = 'Loading active filter and provenance…';
    content.hidden = true;
    try {
        const response = await fetch('/drc/filter-response', {cache:'no-store'});
        const data = await response.json();
        if (!data.ok) {
            status.className = data.running === false ? '' : 'error';
            status.textContent = data.running === false
                ? 'BruteFIR is not running, so no room-correction filter is loaded.'
                : (data.error || 'Filter analysis failed.');
            return;
        }
        responseData = data;
        traces = buildTraceList(data);
        const taps = data.channels.length ? data.channels[0].taps : 0;
        document.getElementById('meta').textContent =
            `${data.geometry} · ${data.rate.toLocaleString()} Hz · ${taps.toLocaleString()} taps`;
        const verdict = document.getElementById('verification');
        const verified = data.verification && data.verification.status === 'verified';
        verdict.className = `verification ${verified?'verified':'mismatch'}`;
        verdict.replaceChildren();
        const badge = el('span', verified?'✓ Verified':'✕ Unverified'); badge.className = 'badge';
        verdict.append(badge, el('span', data.verification?.message || 'No verification result.'));
        if (!verified) {
            status.className = 'error';
            status.textContent =
                `${data.verification?.message || 'The active coefficients match no stored design.'} `
                + 'No curve is drawn: the graph shows measurements exported from REW, and '
                + 'there is no verified set of them for the coefficients BruteFIR has loaded.';
            return;
        }
        responseNote =
            'Every curve above is one REW text export: nothing is averaged, summed or '
            + 'convolved between REW and this page, and the stored arrays and hashes are '
            + `never modified. BruteFIR applies a further ${data.channels[0].attenuation} dB `
            + 'of coefficient attenuation at runtime, deliberately not subtracted from the '
            + 'filter curves so they keep matching REW. Full hashes are below.';
        renderLegend(); renderDetails(data); draw();
        status.hidden = true; content.hidden = false;
    } catch (error) {
        status.className = 'error'; status.textContent = `Network or data error: ${error.message}`;
    }
}

load();
</script>
</body>
</html>
