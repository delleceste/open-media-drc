## Flat (identity) DRC config — shipped default.
## "dirac pulse" is BruteFIR's built-in identity coefficient: a unit impulse,
## so the convolution passes audio through unchanged.  No filter files needed.
## attenuation 0.0 (room filters typically use ~3 dB of headroom): a flat
## filter has no boost, so full scale passes — scripts/verify-bitperfect.sh
## can be used through this chain as a plumbing self-test.
## To add real room correction: put per-rate L.raw/R.raw filters under
## filters/<name>/<rate>/, copy these configs to configs/<name>/ with the
## coeff filenames pointed at them, and set GEOMETRY=<name> in the config
## file (config.env / omdrc.conf).  See FILTERS_AND_DRC.md.

logic: "cli" { port: 3000; };

sampling_rate: 48000;

coeff "c-l" {
	filename: "dirac pulse";
	attenuation: 0.0;
};

coeff "c-r" {
	filename: "dirac pulse";
	attenuation: 0.0;
};

input "left_in", "right_in" {
};

output "left_out", "right_out" {
};

filter "drc_l" {
	from_inputs: "left_in";
	to_outputs: "left_out";
	coeff: "c-l";
};

filter "drc_r" {
	from_inputs: "right_in";
	to_outputs: "right_out";
	coeff: "c-r";
};
