# --- Video output ---
# Force the OpenGL renderer and the OpenGL API. vo=gpu alone still lets
# libplacebo probe Vulkan first (VK_ERROR_FEATURE_NOT_PRESENT); gpu-api=opengl
# skips Vulkan entirely and goes straight to the working OpenGL path.
vo=gpu
gpu-api=opengl

# --- Remote control / automation ---
# Phone/desktop remote is handled by mpv-mpris (auto-loaded from
# /usr/local/etc/mpv/scripts/mpris.so) -> KDE Connect / playerctl / Plasma.
# This extra JSON IPC socket is just for local scripting (echo commands into it).
input-ipc-server=/tmp/mpv-socket

# --- Buffering for the slow USB Blu-ray drive (/dev/cd0, ~2.2 MB/s sustained) ---
# The drive delivers data in slow bursts, so we cache aggressively and read
# far ahead to ride out spin-up stalls, seeks, and bitrate peaks.

# THE key setting for this drive: read the disc in large chunks. mpv's default
# low-level read size is 128 KiB, which on FreeBSD's raw /dev/cd0 (no kernel
# read-ahead) gives only ~3 MB/s. Reading in ~1 MB+ chunks gives ~9.8 MB/s,
# which is fast enough for Blu-ray. (Linux hides this via block-layer readahead.)
stream-buffer-size=4MiB

cache=yes                     # force the cache on (off by default for discs)
demuxer-max-bytes=512MiB      # forward read-ahead buffer held in RAM
demuxer-max-back-bytes=64MiB  # keep some already-played data for small seeks
demuxer-readahead-secs=600    # read as far ahead as the buffer allows
cache-secs=600                # don't trim cached data prematurely

# Let mpv pre-fill the cache before starting, so playback begins with a
# cushion instead of immediately starving on a high-bitrate opening.
cache-pause=yes               # pause (don't drop frames) when the buffer empties
cache-pause-wait=30           # ...and wait until ~30 s is buffered before resuming
cache-pause-initial=yes       # also pre-buffer before the very first frame
